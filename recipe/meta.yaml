{% set name = "lp_solve" %}
{% set version = "5.5.2.11" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}_{{ version }}_source.tar.gz
  url: https://sourceforge.net/projects/lpsolve/files/lpsolve/{{ version }}/{{ name }}_{{ version }}_source.tar.gz
  sha256: 6d4abff5cc6aaa933ae8e6c17a226df0fc0b671c438f69715d41d09fe81f902f

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('lp_solve', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - cmake
    - ninja-base

test:
  commands:
    - lp_solve -h
    - test -f ${PREFIX}/include/lpsolve/lp_lib.h  # [unix]
    - test -f ${PREFIX}/lib/liblpsolve55${SHLIB_EXT}  # [unix]
    - if not exist %PREFIX%\\Library\\include\\lpsolve\\lp_lib.h exit 1  # [win]
    - if not exist %PREFIX%\\Library\\bin\\lpsolve55.dll exit 1  # [win]

about:
  home: https://lpsolve.sourceforge.net/5.5/
  license: LGPL-2.1-only
  license_family: LGPL
  license_file: '{{ environ["RECIPE_DIR"] }}/lgpl-2.1.txt'
  summary: lp_solve is a Mixed Integer Linear Programming (MILP) solver
  description: |
    lp_solve is a free linear (integer) programming solver based on the
    revised simplex method and the branch-and-bound method for the integers.
    It supports MPS and LP file formats and can be used as a library
    (lpsolve55) or via the lp_solve command-line front-end.
  doc_url: https://lpsolve.sourceforge.net/5.5/
  dev_url: https://sourceforge.net/projects/lpsolve/

extra:
  recipe-maintainers:
    - jschueller
    - mictadlo
